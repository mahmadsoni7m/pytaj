name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy барои сохтани лоиҳа Python-и ҳамон версияро дар компютер талаб мекунад.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: android-actions/setup-android@v3

      # Gradle-ро худи CI насб мекунад (wrapper JAR дар ин repo нест, ниг. docs/BUILD_APK.md).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Validate curriculum content
        run: python tools/validate_content.py

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          test -s "$APK"
          cp "$APK" PythonTAJ.apk
          ls -l PythonTAJ.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PythonTAJ-Android-APK
          path: PythonTAJ.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: PythonTAJ-test-reports
          path: app/build/reports/
          if-no-files-found: ignore
